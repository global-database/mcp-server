name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io),
# which is what most directories and clients scrape. Triggered by a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
#
# The `com.globaldatabase/*` namespace requires DNS authentication: a TXT record on the
# apex of globaldatabase.com holding the public key, and the matching private key in the
# MCP_PRIVATE_KEY secret. Setup: see PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The registry rejects a re-publish of a version that already exists, so the tag is
      # the single source of truth for the version number.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate (DNS)
        run: ./mcp-publisher login dns --domain globaldatabase.com --private-key "${MCP_PRIVATE_KEY}"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Publish
        run: ./mcp-publisher publish
